<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Leandro Malungo developer terminal</title>
  <desc id="desc">A polished dark developer workspace showing Leandro's profile, engineering focus and workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2b"/>
      <stop offset="1" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7b56d"/>
      <stop offset="1" stop-color="#8fa3b5"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="498" rx="18" fill="url(#bg)" stroke="#2a3b50" stroke-width="2"/>
  <path d="M1 66H1199" stroke="#26364a"/>
  <circle cx="34" cy="34" r="7" fill="#e06c75"/>
  <circle cx="59" cy="34" r="7" fill="#e5bd65"/>
  <circle cx="84" cy="34" r="7" fill="#7dbb91"/>
  <text x="116" y="40" fill="#dce5ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">LEANDRO / DEVELOPER WORKSPACE</text>
  <text x="1160" y="40" text-anchor="end" fill="#71849a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">PROFILE.SESSION</text>
  <text x="54" y="112" fill="#8fa3b5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">~/leandro</text>
  <text x="54" y="161" fill="#d7b56d" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">$</text>
  <text x="80" y="161" fill="#e7edf5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">whoami</text>
  <text x="80" y="194" fill="#9fb0c2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">Leandro Malungo</text>
  <text x="80" y="222" fill="#71849a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">Software Developer  /  Luanda, Angola</text>
  <path d="M54 249H1146" stroke="#223247"/>
  <text x="54" y="291" fill="#d7b56d" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">$</text>
  <text x="80" y="291" fill="#e7edf5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">cat focus.txt</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
    <rect x="80" y="315" width="300" height="48" rx="7" fill="#152438" stroke="#2b4058"/>
    <text x="101" y="345" fill="#d7b56d">01</text><text x="137" y="345" fill="#dce5ef">Digital products</text>
    <rect x="400" y="315" width="300" height="48" rx="7" fill="#152438" stroke="#2b4058"/>
    <text x="421" y="345" fill="#d7b56d">02</text><text x="457" y="345" fill="#dce5ef">Backend &amp; systems</text>
    <rect x="720" y="315" width="300" height="48" rx="7" fill="#152438" stroke="#2b4058"/>
    <text x="741" y="345" fill="#d7b56d">03</text><text x="777" y="345" fill="#dce5ef">Applied AI &amp; data</text>
  </g>
  <path d="M54 389H1146" stroke="#223247"/>
  <text x="54" y="429" fill="#d7b56d" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">$</text>
  <text x="80" y="429" fill="#e7edf5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">build --workflow</text>
  <text x="270" y="429" fill="#9fb0c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Understand</text>
  <text x="370" y="429" fill="#52677f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">→</text>
  <text x="397" y="429" fill="#9fb0c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Engineer</text>
  <text x="485" y="429" fill="#52677f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">→</text>
  <text x="512" y="429" fill="#9fb0c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Test</text>
  <text x="562" y="429" fill="#52677f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">→</text>
  <text x="589" y="429" fill="#9fb0c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Deliver</text>
  <rect x="1000" y="408" width="146" height="34" rx="17" fill="#182a29" stroke="#31554b"/>
  <circle cx="1020" cy="425" r="4" fill="#7dbb91"/>
  <text x="1033" y="430" fill="#a9c8b4" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">READ ONLY</text>
