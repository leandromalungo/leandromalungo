    <path d="M-102 39 C-48 51 37 51 119 34 L93 61 L-72 61Z"/>
    <path d="M-10 35V-91" stroke="#050D17" stroke-width="5"/>
    <path d="M-5 -84L-72 27H-5Z"/>
    <path d="M3 -72L75 25H3Z"/>
    <path d="M-78 29L-17 29L-42 39Z"/>
