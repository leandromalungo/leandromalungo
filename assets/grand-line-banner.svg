  <path d="M928 279 C1000 269 1090 289 1171 277 S1300 270 1400 280" fill="none" stroke="#D7B56D" stroke-opacity=".32" stroke-width="1.4"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="84" y="78" fill="#D7B56D" font-size="12" font-weight="600" letter-spacing="4">FIELD NOTES  /  01</text>
    <text x="80" y="160" fill="#F3F0E8" font-size="61" font-weight="700" letter-spacing="-1.8">LEANDRO MALUNGO</text>
    <rect x="84" y="188" width="54" height="3" fill="#D7B56D"/>
