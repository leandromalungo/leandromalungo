    <text x="84" y="260" fill="#A9BAC9" font-size="13" letter-spacing="2.2">BUILDING DIGITAL PRODUCTS · ANGOLA</text>
  </g>

  <path d="M84 316H1316" stroke="#D7B56D" stroke-opacity=".22" stroke-width="1"/>
