<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Leandro Malungo — Software Developer</title>
  <desc id="desc">A refined nautical-inspired banner with a deep navy sea, navigation lines, a compass and a ship silhouette.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1728"/>
      <stop offset="0.58" stop-color="#10243A"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7B56D" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#D7B56D" stop-opacity=".58"/>
      <stop offset="1" stop-color="#D7B56D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="45%" r="48%">
      <stop offset="0" stop-color="#31516A" stop-opacity=".48"/>
      <stop offset="1" stop-color="#10243A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="coordinates" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#B9C8D6" stroke-opacity=".055" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#D7B56D" fill-opacity=".22"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#background)"/>
  <rect width="1400" height="360" fill="url(#glow)"/>
  <rect width="1400" height="360" fill="url(#coordinates)"/>

  <path d="M0 276 C230 251 390 291 610 269 S1000 252 1400 275" fill="none" stroke="#8CA5B8" stroke-opacity=".14" stroke-width="1.2"/>
  <path d="M0 294 C250 272 430 310 675 286 S1090 274 1400 296" fill="none" stroke="#8CA5B8" stroke-opacity=".10" stroke-width="1"/>
  <path d="M690 82H1330" stroke="url(#horizon)" stroke-width="1"/>

  <g opacity=".20" stroke="#D7B56D" fill="none">
    <circle cx="1124" cy="168" r="118" stroke-width="1"/>
    <circle cx="1124" cy="168" r="94" stroke-width="1"/>
    <circle cx="1124" cy="168" r="4" fill="#D7B56D" stroke="none"/>
    <path d="M1124 35V301M991 168H1257M1030 74L1218 262M1218 74L1030 262" stroke-width="1"/>
    <path d="M1124 52L1133 158L1124 147L1115 158Z" fill="#D7B56D" stroke="none" opacity=".7"/>
