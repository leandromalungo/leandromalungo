  <g fill="#D7B56D" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" opacity=".62">
    <text x="1124" y="25" text-anchor="middle">N</text>
    <text x="1271" y="171">E</text>
    <text x="1124" y="321" text-anchor="middle">S</text>
    <text x="976" y="171" text-anchor="end">W</text>
  </g>

